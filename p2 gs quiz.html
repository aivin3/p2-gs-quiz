<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小二常識練習 — 我愛社區 & 郊遊樂</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #4fc3f7;
    --sky-dark: #0288d1;
    --green: #66bb6a;
    --green-dark: #388e3c;
    --orange: #ffa726;
    --orange-dark: #e65100;
    --red: #ef5350;
    --coral: #ff7043;
    --yellow: #fff176;
    --white: #ffffff;
    --bg: #e8f5e9;
    --card: #ffffff;
    --text: #1a237e;
    --muted: #546e7a;
    --radius: 20px;
    --shadow: 0 8px 32px rgba(0,0,0,0.13);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', 'Noto Sans TC', sans-serif;
    background: linear-gradient(160deg, #e3f2fd 0%, #e8f5e9 50%, #fff9c4 100%);
    min-height: 100vh;
    color: var(--text);
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, #29b6f6 0%, #26c6da 50%, #66bb6a 100%);
    padding: 28px 20px 22px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(255,255,255,.18) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 30%, rgba(255,255,255,.12) 0%, transparent 50%);
  }
  header h1 {
    font-size: clamp(1.5rem, 5vw, 2.4rem);
    font-weight: 900;
    color: #fff;
    letter-spacing: .5px;
    text-shadow: 0 3px 12px rgba(0,0,0,.2);
    position: relative;
  }
  header p {
    color: rgba(255,255,255,.92);
    font-size: .95rem;
    margin-top: 6px;
    font-weight: 600;
    position: relative;
  }

  /* ── PROGRESS BAR ── */
  #progress-wrap {
    background: rgba(255,255,255,.7);
    backdrop-filter: blur(8px);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 2px solid rgba(79,195,247,.3);
  }
  #progress-bar-bg {
    flex: 1;
    height: 12px;
    background: #e0e0e0;
    border-radius: 99px;
    overflow: hidden;
  }
  #progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #29b6f6, #66bb6a);
    border-radius: 99px;
    width: 0%;
    transition: width .4s ease;
  }
  #progress-text {
    font-weight: 800;
    font-size: .9rem;
    color: var(--sky-dark);
    white-space: nowrap;
  }
  #score-badge {
    background: linear-gradient(135deg, #ffa726, #ff7043);
    color: #fff;
    font-weight: 800;
    font-size: .85rem;
    padding: 4px 12px;
    border-radius: 99px;
    white-space: nowrap;
  }

  /* ── MAIN CONTENT ── */
  main {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  /* ── UNIT DIVIDER ── */
  .unit-title {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 32px 0 16px;
  }
  .unit-title .badge {
    background: linear-gradient(135deg, #29b6f6, #0288d1);
    color: #fff;
    font-weight: 900;
    font-size: 1rem;
    padding: 6px 18px;
    border-radius: 99px;
    white-space: nowrap;
    box-shadow: 0 4px 12px rgba(2,136,209,.3);
  }
  .unit-title .badge.green {
    background: linear-gradient(135deg, #66bb6a, #388e3c);
    box-shadow: 0 4px 12px rgba(56,142,60,.3);
  }
  .unit-title hr {
    flex: 1;
    border: none;
    border-top: 2.5px dashed #b0bec5;
  }

  /* ── QUESTION CARD ── */
  .q-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    overflow: hidden;
    border: 2.5px solid transparent;
    transition: border-color .3s, box-shadow .3s;
    animation: slideUp .4s ease both;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(18px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .q-card.correct { border-color: var(--green); box-shadow: 0 8px 32px rgba(102,187,106,.25); }
  .q-card.wrong   { border-color: var(--red);   box-shadow: 0 8px 32px rgba(239,83,80,.22); }

  .q-header {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 18px 20px 14px;
  }
  .q-num {
    background: linear-gradient(135deg, #4fc3f7, #0288d1);
    color: #fff;
    font-weight: 900;
    font-size: .9rem;
    min-width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 3px 8px rgba(2,136,209,.35);
  }
  .q-num.answered-correct { background: linear-gradient(135deg, #66bb6a, #388e3c); }
  .q-num.answered-wrong   { background: linear-gradient(135deg, #ef5350, #b71c1c); }

  .q-text {
    font-size: 1.05rem;
    font-weight: 700;
    line-height: 1.6;
    padding-top: 4px;
  }

  /* ── OPTIONS ── */
  .options {
    padding: 0 20px 18px;
    display: grid;
    gap: 8px;
  }
  .opt-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 16px;
    border: 2.5px solid #e0e0e0;
    border-radius: 14px;
    background: #fafafa;
    cursor: pointer;
    font-family: inherit;
    font-size: .95rem;
    font-weight: 600;
    color: var(--text);
    text-align: left;
    transition: all .18s;
    width: 100%;
  }
  .opt-btn:hover:not(:disabled) {
    border-color: #4fc3f7;
    background: #e1f5fe;
    transform: translateX(4px);
  }
  .opt-letter {
    background: #e3f2fd;
    color: #0288d1;
    font-weight: 900;
    font-size: .82rem;
    min-width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background .18s, color .18s;
  }
  .opt-btn:hover:not(:disabled) .opt-letter {
    background: #0288d1;
    color: #fff;
  }
  .opt-btn.selected-correct {
    border-color: var(--green);
    background: #f1f8e9;
    cursor: default;
  }
  .opt-btn.selected-correct .opt-letter { background: var(--green); color: #fff; }
  .opt-btn.selected-wrong {
    border-color: var(--red);
    background: #ffebee;
    cursor: default;
  }
  .opt-btn.selected-wrong .opt-letter { background: var(--red); color: #fff; }
  .opt-btn.reveal-correct {
    border-color: var(--green);
    background: #f1f8e9;
    cursor: default;
  }
  .opt-btn.reveal-correct .opt-letter { background: var(--green); color: #fff; }
  .opt-btn:disabled { cursor: default; }

  /* ── EXPLANATION ── */
  .explanation {
    margin: 0 20px 18px;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: .9rem;
    font-weight: 600;
    line-height: 1.65;
    display: none;
  }
  .explanation.show { display: block; animation: fadeIn .3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .explanation.correct-exp {
    background: #e8f5e9;
    border-left: 4px solid var(--green);
    color: #2e7d32;
  }
  .explanation.wrong-exp {
    background: #fff3e0;
    border-left: 4px solid var(--orange);
    color: #e65100;
  }
  .exp-icon { margin-right: 6px; }

  /* ── RESULT PANEL ── */
  #result-panel {
    display: none;
    text-align: center;
    padding: 40px 24px;
    background: #fff;
    border-radius: 28px;
    box-shadow: 0 12px 48px rgba(0,0,0,.15);
    margin-top: 32px;
    animation: popIn .5s cubic-bezier(.34,1.56,.64,1);
  }
  @keyframes popIn {
    from { opacity: 0; transform: scale(.85); }
    to   { opacity: 1; transform: scale(1); }
  }
  #result-panel .star { font-size: 3.5rem; margin-bottom: 12px; }
  #result-panel h2 { font-size: 1.8rem; font-weight: 900; color: var(--text); margin-bottom: 8px; }
  #result-panel .score-big {
    font-size: 4rem;
    font-weight: 900;
    background: linear-gradient(135deg, #29b6f6, #66bb6a);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1.1;
    margin: 10px 0;
  }
  #result-panel p { color: var(--muted); font-weight: 600; font-size: 1rem; }
  #result-panel .stars-row { font-size: 2rem; margin: 12px 0; }

  .btn-restart {
    margin-top: 24px;
    padding: 14px 36px;
    background: linear-gradient(135deg, #29b6f6, #0288d1);
    color: #fff;
    border: none;
    border-radius: 99px;
    font-family: inherit;
    font-size: 1.05rem;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(2,136,209,.4);
    transition: transform .15s, box-shadow .15s;
  }
  .btn-restart:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(2,136,209,.5); }

  /* ── SUBMIT ── */
  #submit-wrap {
    text-align: center;
    margin-top: 28px;
  }
  #submit-btn {
    padding: 15px 48px;
    background: linear-gradient(135deg, #ffa726, #ff7043);
    color: #fff;
    border: none;
    border-radius: 99px;
    font-family: inherit;
    font-size: 1.1rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 6px 24px rgba(255,112,67,.4);
    transition: transform .15s, box-shadow .15s, opacity .15s;
    letter-spacing: .3px;
  }
  #submit-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(255,112,67,.5); }
  #submit-btn:disabled { opacity: .5; cursor: default; transform: none; }

  /* ── FLOATING DECOR ── */
  .deco {
    position: fixed;
    pointer-events: none;
    user-select: none;
    font-size: 2rem;
    opacity: .12;
    animation: float 6s ease-in-out infinite;
  }
  .deco:nth-child(1) { top: 8%; left: 3%; animation-delay: 0s; }
  .deco:nth-child(2) { top: 25%; right: 4%; animation-delay: 1.5s; font-size: 1.6rem; }
  .deco:nth-child(3) { bottom: 30%; left: 5%; animation-delay: 3s; font-size: 1.4rem; }
  .deco:nth-child(4) { bottom: 15%; right: 3%; animation-delay: 2s; }
  @keyframes float {
    0%,100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-16px) rotate(8deg); }
  }

  @media (max-width: 520px) {
    .q-text { font-size: .95rem; }
    .opt-btn { font-size: .88rem; padding: 10px 13px; }
    header h1 { font-size: 1.4rem; }
  }

  /* ── RESUME TOAST ── */
  #resume-toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: linear-gradient(135deg, #1e88e5, #0288d1);
    color: #fff;
    padding: 14px 22px;
    border-radius: 99px;
    font-weight: 700;
    font-size: .95rem;
    display: flex;
    align-items: center;
    gap: 14px;
    box-shadow: 0 8px 28px rgba(2,136,209,.45);
    z-index: 999;
    white-space: nowrap;
    animation: toastIn .4s cubic-bezier(.34,1.56,.64,1);
    transition: opacity .5s ease;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateX(-50%) translateY(20px); }
    to   { opacity: 1; transform: translateX(-50%) translateY(0); }
  }
  #resume-toast button {
    background: rgba(255,255,255,.25);
    border: none;
    color: #fff;
    font-size: 1rem;
    width: 26px; height: 26px;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-weight: 900;
    flex-shrink: 0;
  }
  #resume-toast button:hover { background: rgba(255,255,255,.4); }

  /* ── SAVE INDICATOR in progress bar ── */
  #save-indicator {
    font-size: .78rem;
    font-weight: 700;
    color: #66bb6a;
    opacity: 0;
    transition: opacity .3s;
    white-space: nowrap;
  }
  #save-indicator.show { opacity: 1; }
</style>
</head>
<body>

<div class="deco">🏘️</div>
<div class="deco">🌿</div>
<div class="deco">🗺️</div>
<div class="deco">🌊</div>

<header>
  <h1>🏫 小二常識互動練習</h1>
  <p>單元一：我愛社區　｜　單元二：郊遊樂　　共 40 題</p>
</header>

<div id="progress-wrap">
  <div id="progress-bar-bg"><div id="progress-bar"></div></div>
  <span id="progress-text">0 / 40</span>
  <span id="score-badge">✨ 0 分</span>
  <span id="save-indicator">💾 已儲存</span>
</div>

<main id="quiz-main">
  <!-- questions injected by JS -->
  <div id="submit-wrap">
    <button id="submit-btn" disabled onclick="submitQuiz()">📝 提交答案，看成績！</button>
  </div>
  <div id="result-panel"></div>
</main>

<script>
const questions = [
  // ══ 單元一 第1課：認識社區環境 ══
  {
    unit: 1, lesson: "第1課・認識社區環境",
    q: "香港分為哪三個主要區域？",
    opts: ["A. 東區、西區、南區", "B. 香港島、九龍和新界", "C. 荃灣、沙田、大嶼山", "D. 觀塘、深水埗、元朗"],
    ans: 1,
    exp: "香港分為香港島、九龍和新界三個主要區域，它們分別由不同的社區組成。"
  },
  {
    unit: 1, lesson: "第1課・認識社區環境",
    q: "以下哪個選項正確描述沙田的特色地標？",
    opts: ["A. 沙田有香港中央圖書館", "B. 沙田有望夫石和車公廟", "C. 沙田有維多利亞公園", "D. 沙田有金紫荊廣場"],
    ans: 1,
    exp: "沙田有望夫石和車公廟，是沙田的特色地標。銅鑼灣才有香港中央圖書館和維多利亞公園。"
  },
  {
    unit: 1, lesson: "第1課・認識社區環境",
    q: "銅鑼灣有哪些著名地標？",
    opts: ["A. 望夫石和車公廟", "B. 八仙嶺和城門水塘", "C. 香港中央圖書館和維多利亞公園", "D. 西貢海濱和清水灣"],
    ans: 2,
    exp: "銅鑼灣有香港中央圖書館和維多利亞公園，是銅鑼灣的著名地標。"
  },
  {
    unit: 1, lesson: "第1課・認識社區環境",
    q: "方向標主要分為哪四個方向？",
    opts: ["A. 左、右、前、後", "B. 東南西北四個方向", "C. 上、下、左、右", "D. 東南、西南、東北、西北"],
    ans: 1,
    exp: "方向標主要分為四個方向：東方、南方、西方、北方。"
  },
  {
    unit: 1, lesson: "第1課・認識社區環境",
    q: "規劃行程時，可以利用甚麼工具找出方向？",
    opts: ["A. 望遠鏡", "B. 計算機", "C. 地圖", "D. 手錶"],
    ans: 2,
    exp: "當我們需要規劃行程時，可以閱讀地圖找出方向。"
  },
  {
    unit: 1, lesson: "第1課・認識社區環境",
    q: "繪製圖像地圖時，第一步要怎樣做？",
    opts: ["A. 先畫上方向標", "B. 先平放指南針，轉動方向盤至指針指向正北方", "C. 先把景物以圖像形式記錄下來", "D. 先決定地圖的範圍"],
    ans: 1,
    exp: "繪製圖像地圖時，要先平放指南針，轉動方向盤，直至指針着色的一端指向正北方，再找出四個方向。"
  },
  {
    unit: 1, lesson: "第1課・認識社區環境",
    q: "圖像地圖上的景物是以甚麼形式記錄的？",
    opts: ["A. 文字描述", "B. 數字編號", "C. 圖像形式", "D. 顏色標示"],
    ans: 2,
    exp: "繪製圖像地圖時，要把位於四個方向上具代表性的景物以圖像形式記錄下來，並畫上方向標。"
  },
  {
    unit: 1, lesson: "第1課・認識社區環境",
    q: "以下關於香港社區的描述，哪項正確？",
    opts: ["A. 香港所有社區的特色都完全一樣", "B. 香港只有一個主要區域", "C. 每個區域內的社區各具特色", "D. 香港社區全部在九龍"],
    ans: 2,
    exp: "香港由香港島、九龍和新界三個主要區域組成，每個區域內的社區各具特色。"
  },

  // ══ 單元一 第2課：社區遊蹤 ══
  {
    unit: 1, lesson: "第2課・社區遊蹤",
    q: "社區內有哪些類型的設施？",
    opts: ["A. 只有交通和購物設施", "B. 交通、康樂文娛、救援、購物等設施", "C. 只有救援設施", "D. 只有康樂文娛設施"],
    ans: 1,
    exp: "社區內有交通、康樂文娛、救援、購物等設施，滿足我們生活上的各種需要。"
  },
  {
    unit: 1, lesson: "第2課・社區遊蹤",
    q: "以下哪個是為有需要的人而設的社區設施？",
    opts: ["A. 超級市場", "B. 電影院", "C. 暢通易達洗手間", "D. 圖書館閱覽室"],
    ans: 2,
    exp: "社區內一些設施是為有需要的人而設，例如暢通易達洗手間、哺乳室、引路徑等。"
  },
  {
    unit: 1, lesson: "第2課・社區遊蹤",
    q: "以下哪項屬於無障礙社區設施？",
    opts: ["A. 電子遊戲機", "B. 哺乳室和引路徑", "C. 戲院大銀幕", "D. 停車場"],
    ans: 1,
    exp: "無障礙社區設施是為有需要的人而設，例如哺乳室、引路徑、暢通易達洗手間等。"
  },
  {
    unit: 1, lesson: "第2課・社區遊蹤",
    q: "在博物館參觀時，應該怎樣做？",
    opts: ["A. 可以觸碰展品，方便近距離欣賞", "B. 切勿觸碰展品和用閃光燈拍攝", "C. 可以大聲討論展品的特點", "D. 可以帶走喜歡的展品"],
    ans: 1,
    exp: "在博物館參觀時切勿觸碰展品和用閃光燈拍攝，避免展品受損。"
  },
  {
    unit: 1, lesson: "第2課・社區遊蹤",
    q: "在劇院欣賞話劇時，應該怎樣做？",
    opts: ["A. 可以邊吃東西邊看表演", "B. 可以不斷拍照記錄", "C. 要保持安靜，以免打擾別人", "D. 覺得悶就可以離開"],
    ans: 2,
    exp: "在劇院欣賞話劇時要保持安靜，以免打擾別人。使用設施時，我們要遵守規則、愛護公物、尊重他人。"
  },
  {
    unit: 1, lesson: "第2課・社區遊蹤",
    q: "使用社區設施時，我們應該遵守哪些原則？",
    opts: ["A. 爭先使用，不理他人", "B. 遵守規則、愛護公物、尊重他人", "C. 只顧自己方便，不管規則", "D. 破壞設施也沒關係"],

// ── STORAGE KEY ──
const SAVE_KEY = 'p2gs_quiz_v1';

// ── STATE ──
let answered = new Array(questions.length).fill(null); // null | {correct, chosen}
let score = 0;
let submitted = false;
let lastAnsweredIndex = -1; // for scroll restore

// ── SAVE / LOAD ──
function saveState() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({ answered, score, submitted }));
    const ind = document.getElementById('save-indicator');
    if (ind) {
      ind.classList.add('show');
      clearTimeout(ind._t);
      ind._t = setTimeout(() => ind.classList.remove('show'), 1500);
    }
  } catch(e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const s = JSON.parse(raw);
    if (!s.answered || s.answered.length !== questions.length) return false;
    answered = s.answered;
    score = s.score || 0;
    submitted = s.submitted || false;
    return true;
  } catch(e) { return false; }
}

function clearState() {
  try { localStorage.removeItem(SAVE_KEY); } catch(e) {}
}

// ── BUILD QUIZ ──
function buildQuiz() {
  const main = document.getElementById('quiz-main');
  const submitWrap = document.getElementById('submit-wrap');

  let currentUnit = 0;
  const fragment = document.createDocumentFragment();

  questions.forEach((q, i) => {
    if (q.unit !== currentUnit) {
      currentUnit = q.unit;
      const div = document.createElement('div');
      div.className = 'unit-title';
      const cls = q.unit === 1 ? '' : 'green';
      const icon = q.unit === 1 ? '🏘️' : '🌿';
      div.innerHTML = `<span class="badge ${cls}">${icon} 單元${q.unit === 1 ? '一' : '二'}：${q.unit === 1 ? '我愛社區' : '郊遊樂'}</span><hr>`;
      fragment.appendChild(div);
    }

    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `card-${i}`;
    card.style.animationDelay = `${i * 0.025}s`;

    const optHTML = q.opts.map((o, j) => {
      const letter = ['A','B','C','D'][j];
      return `<button class="opt-btn" id="opt-${i}-${j}" onclick="choose(${i},${j})">
        <span class="opt-letter">${letter}</span>${o.slice(3)}
      </button>`;
    }).join('');

    card.innerHTML = `
      <div class="q-header">
        <div class="q-num" id="qnum-${i}">${i+1}</div>
        <div class="q-text">${q.q}</div>
      </div>
      <div class="options" id="opts-${i}">${optHTML}</div>
      <div class="explanation" id="exp-${i}"></div>
    `;
    fragment.appendChild(card);
  });

  main.insertBefore(fragment, submitWrap);
}

// ── RESTORE answered questions visually ──
function restoreUI() {
  questions.forEach((q, i) => {
    const a = answered[i];
    if (a === null) return;

    lastAnsweredIndex = i;
    const correct = a.correct;
    const chosenOi = a.chosen;

    // Disable + colour all opts
    for (let j = 0; j < q.opts.length; j++) {
      const btn = document.getElementById(`opt-${i}-${j}`);
      btn.disabled = true;
      if (j === q.ans) btn.classList.add('reveal-correct');
    }
    const selectedBtn = document.getElementById(`opt-${i}-${chosenOi}`);
    if (correct) {
      selectedBtn.classList.remove('reveal-correct');
      selectedBtn.classList.add('selected-correct');
    } else {
      selectedBtn.classList.add('selected-wrong');
    }

    // Card border
    document.getElementById(`card-${i}`).classList.add(correct ? 'correct' : 'wrong');

    // Num bubble
    const numEl = document.getElementById(`qnum-${i}`);
    numEl.classList.add(correct ? 'answered-correct' : 'answered-wrong');
    numEl.textContent = correct ? '✓' : '✗';

    // Explanation (no animation on restore)
    const exp = document.getElementById(`exp-${i}`);
    exp.className = `explanation show ${correct ? 'correct-exp' : 'wrong-exp'}`;
    exp.innerHTML = `<span class="exp-icon">${correct ? '🌟' : '💡'}</span>${q.exp}`;
  });

  // If already submitted, re-show result
  if (submitted) {
    showResult(false);
    document.getElementById('submit-btn').disabled = true;
    document.getElementById('submit-btn').textContent = '已提交 ✓';
  }
}

// ── CHOOSE ──
function choose(qi, oi) {
  if (submitted) return;
  if (answered[qi] !== null) return;

  const q = questions[qi];
  const correct = oi === q.ans;
  answered[qi] = { correct, chosen: oi };
  if (correct) score++;

  for (let j = 0; j < q.opts.length; j++) {
    const btn = document.getElementById(`opt-${qi}-${j}`);
    btn.disabled = true;
    if (j === q.ans) btn.classList.add('reveal-correct');
  }

  const selectedBtn = document.getElementById(`opt-${qi}-${oi}`);
  if (!correct) selectedBtn.classList.add('selected-wrong');
  else { selectedBtn.classList.remove('reveal-correct'); selectedBtn.classList.add('selected-correct'); }

  document.getElementById(`card-${qi}`).classList.add(correct ? 'correct' : 'wrong');

  const numEl = document.getElementById(`qnum-${qi}`);
  numEl.classList.add(correct ? 'answered-correct' : 'answered-wrong');
  numEl.textContent = correct ? '✓' : '✗';

  const exp = document.getElementById(`exp-${qi}`);
  exp.className = `explanation show ${correct ? 'correct-exp' : 'wrong-exp'}`;
  exp.innerHTML = `<span class="exp-icon">${correct ? '🌟' : '💡'}</span>${q.exp}`;

  saveState();       // 💾 auto-save after every answer
  updateProgress();
}

// ── PROGRESS ──
function updateProgress() {
  const done = answered.filter(a => a !== null).length;
  const pct = (done / questions.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
  document.getElementById('progress-text').textContent = `${done} / ${questions.length}`;
  document.getElementById('score-badge').textContent = `✨ ${score} 分`;

  if (done === questions.length && !submitted) {
    document.getElementById('submit-btn').disabled = false;
  }
}

// ── SUBMIT ──
function submitQuiz() {
  submitted = true;
  saveState();
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('submit-btn').textContent = '已提交 ✓';
  showResult(true);
}

function showResult(scroll) {
  const pct = Math.round((score / questions.length) * 100);
  let stars = '⭐', msg = '再努力溫習，下次一定更好！';
  if (pct >= 95) { stars = '🌟🌟🌟'; msg = '非常出色！你是常識小達人！'; }
  else if (pct >= 80) { stars = '🌟🌟'; msg = '做得很好！繼續加油！'; }
  else if (pct >= 60) { stars = '⭐⭐'; msg = '不錯喔！再溫習一下吧！'; }

  const panel = document.getElementById('result-panel');
  panel.style.display = 'block';
  panel.innerHTML = `
    <div class="star">🎉</div>
    <h2>練習完成！</h2>
    <div class="score-big">${score} / ${questions.length}</div>
    <p>正確率：${pct}%</p>
    <div class="stars-row">${stars}</div>
    <p>${msg}</p>
    <button class="btn-restart" onclick="restartQuiz()">🔄 重新開始（清除記錄）</button>
  `;
  if (scroll) panel.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ── RESTART ──
function restartQuiz() {
  if (!confirm('確定要重新開始嗎？所有進度將會清除。')) return;
  clearState();
  answered = new Array(questions.length).fill(null);
  score = 0;
  submitted = false;
  lastAnsweredIndex = -1;

  document.getElementById('result-panel').style.display = 'none';
  document.getElementById('submit-btn').disabled = true;
  document.getElementById('submit-btn').textContent = '📝 提交答案，看成績！';

  document.querySelectorAll('.q-card, .unit-title').forEach(el => el.remove());
  buildQuiz();
  updateProgress();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── INIT ──
const hasSave = loadState();
buildQuiz();

if (hasSave) {
  // Show toast
  const toast = document.createElement('div');
  toast.id = 'resume-toast';
  toast.innerHTML = `
    <span>📂 已還原上次進度！繼續作答吧。</span>
    <button onclick="dismissToast()">✕</button>
  `;
  document.body.appendChild(toast);
  setTimeout(() => { if(toast.parentNode) toast.style.opacity='0'; }, 4000);
  setTimeout(() => { if(toast.parentNode) toast.remove(); }, 4600);

  restoreUI();

  // Scroll to first unanswered question
  const firstUnanswered = answered.findIndex(a => a === null);
  if (firstUnanswered !== -1 && !submitted) {
    setTimeout(() => {
      const el = document.getElementById(`card-${firstUnanswered}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 500);
  }
}

updateProgress();

function dismissToast() {
  const t = document.getElementById('resume-toast');
  if (t) { t.style.opacity = '0'; setTimeout(()=>t.remove(), 500); }
}
</script>
</body>
</html>
